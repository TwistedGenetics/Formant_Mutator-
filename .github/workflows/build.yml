name: Build FORMANT MUTATOR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain and logue SDK
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('build.sh') }}

      - name: Build unit
        run: ./build.sh

      - name: Run DSP tests
        run: ./test/run.sh 60

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FormantMutator-nts1mkii
          path: |
            dist/FormantMutator.nts1mkiiunit
            test/out/

      - name: Read unit version from header.c
        id: ver
        run: |
          hex=$(grep -oE '\.version = 0x[0-9A-Fa-f]+' formant_mutator/header.c | grep -oE '0x[0-9A-Fa-f]+')
          v=$(( hex ))
          tag="v$(( (v >> 16) & 0xFF )).$(( (v >> 8) & 0xFF )).$(( v & 0xFF ))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Unit version $tag"

      - name: Zip preset renders
        run: cd test/out && zip -q ../../dist/FormantMutator-preset-renders.zip *.wav test_report.txt

      # New version on main -> new Release. Re-runs of an existing version just update its files.
      - name: Publish release
        if: >-
          github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FORMANT MUTATOR ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || steps.ver.outputs.tag }}
          make_latest: true
          files: |
            dist/FormantMutator.nts1mkiiunit
            dist/FormantMutator-preset-renders.zip
          body: |
            FORMANT MUTATOR formant oscillator for the Korg NTS-1 digital kit mkII.

            **Install:** download `FormantMutator.nts1mkiiunit` below, open KORG KONTROL Editor with the NTS-1 mkII connected, drag the file onto the **oscillator** list and press **SEND**.

            `FormantMutator-preset-renders.zip` has WAV previews of the 8 presets from the [preset guide](https://github.com/${{ github.repository }}/blob/main/docs/PRESETS.md).

            Controls, modes and presets: see the [README](https://github.com/${{ github.repository }}#readme).
