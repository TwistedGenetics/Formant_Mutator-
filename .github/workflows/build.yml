name: Build FORMANT MUTATOR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain and logue SDK
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('build.sh') }}

      - name: Build NTS-1 mkII unit
        run: ./build.sh nts1

      - name: Build microKORG 2 unit (Korg toolchain)
        run: ./build.sh mk2

      - name: Check build outputs
        run: |
          file dist/FormantMutator.nts1mkiiunit dist/FormantMutator.mk2unit
          ls -l dist/
          # Report unit details as annotations (visible in the run summary).
          for f in dist/FormantMutator.nts1mkiiunit dist/FormantMutator.mk2unit dist/FMutator-diagnostic.mk2unit dist/FMutator-loadmeter.mk2unit; do
            info="$(file -b "$f" | cut -c1-120) | $(stat -c %s "$f") bytes"
            exports="$(readelf -W --dyn-syms "$f" | awk '$5=="GLOBAL" && $7!="UND" {print $8}' | grep -E '^unit_' | sort | tr '\n' ' ')"
            imports="$(readelf -W --dyn-syms "$f" | awk '$7=="UND" && $8!="" {print $8}' | sort -u | tr '\n' ' ')"
            needed="$(readelf -d "$f" | awk '/NEEDED/ {print $5}' | tr '\n' ' ')"
            echo "::notice title=$(basename "$f")::$info%0Aexports: $exports%0Aimports: $imports%0Aneeded: $needed"
          done

      - name: Run DSP tests
        run: ./test/run.sh 60

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: FormantMutator-units
          path: |
            dist/FormantMutator.nts1mkiiunit
            dist/FormantMutator.mk2unit
            test/out/

      - name: Read unit version from header.c
        id: ver
        run: |
          hex=$(grep -oE '\.version = 0x[0-9A-Fa-f]+' formant_mutator/header.c | grep -oE '0x[0-9A-Fa-f]+')
          hex2=$(grep -oE '\.version = 0x[0-9A-Fa-f]+' microkorg2/header.c | grep -oE '0x[0-9A-Fa-f]+')
          if [ "$hex" != "$hex2" ]; then echo "::error::formant_mutator/header.c and microkorg2/header.c versions differ"; exit 1; fi
          v=$(( hex ))
          tag="v$(( (v >> 16) & 0xFF )).$(( (v >> 8) & 0xFF )).$(( v & 0xFF ))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Unit version $tag"

      - name: Zip preset renders
        run: cd test/out && zip -q ../../dist/FormantMutator-preset-renders.zip *.wav test_report.txt

      # New version on main -> new Release. Re-runs of an existing version just update its files.
      - name: Publish release
        if: >-
          github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && github.event_name != 'pull_request')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FORMANT MUTATOR ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || steps.ver.outputs.tag }}
          make_latest: true
          files: |
            dist/FormantMutator.nts1mkiiunit
            dist/FormantMutator.mk2unit
            dist/FMutator-diagnostic.mk2unit
            dist/FMutator-loadmeter.mk2unit
            dist/FormantMutator-preset-renders.zip
          body: |
            FORMANT MUTATOR formant oscillator for the Korg **NTS-1 digital kit mkII** and **microKORG 2**.

            | Synth | File |
            |---|---|
            | NTS-1 mkII | `FormantMutator.nts1mkiiunit` |
            | microKORG 2 (firmware 2.0.0 or later) | `FormantMutator.mk2unit` |

            **Install:** download the file for your synth below, open KORG KONTROL Editor with the synth connected, drag the file onto the **oscillator** list and press **SEND**.

            `FMutator-diagnostic.mk2unit` is a troubleshooting tool for the microKORG 2, not an instrument: it plays a plain tone through the same voice handling as FMutator. A clean **sine** means the synth sends voice events; a buzzy **saw** means it doesn't. Its TONE parameter also shows EVENTS / NO EVT.

            `FMutator-loadmeter.mk2unit` (shows as **FMmeter**) is FMutator with a CPU meter: the MODE display shows the peak share of real time its rendering took over the last half second, e.g. `TALK 37%`.

            `FormantMutator-preset-renders.zip` has WAV previews of the 8 presets from the [preset guide](https://github.com/${{ github.repository }}/blob/main/docs/PRESETS.md).

            Controls, modes and presets: see the [README](https://github.com/${{ github.repository }}#readme).
